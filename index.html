<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Functional Groups Quiz — Chem 17</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#fbfaf6; --ink:#1a1a1a; --mute:#6b6a66; --line:#d9d6cd; --panel:#ffffff;
  --red:#e2402f; --redsoft:#fdeceb; --blue:#2f5fd0; --bluesoft:#eaf0fc;
  --ok:#1f8a4c; --oksoft:#e6f5ec; --bad:#c43a2a; --badsoft:#fbe9e6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17181b; --ink:#f1efe8; --mute:#a09e97; --line:#34363b; --panel:#1f2024;
  --red:#ff6a58; --redsoft:#3a211e; --blue:#7ea0ff; --bluesoft:#1f2838;
  --ok:#5fd08a; --oksoft:#1d3328; --bad:#ff7b6b; --badsoft:#3b2320;
}}
:root[data-theme="dark"]{
  --paper:#17181b; --ink:#f1efe8; --mute:#a09e97; --line:#34363b; --panel:#1f2024;
  --red:#ff6a58; --redsoft:#3a211e; --blue:#7ea0ff; --bluesoft:#1f2838;
  --ok:#5fd08a; --oksoft:#1d3328; --bad:#ff7b6b; --badsoft:#3b2320;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;color:var(--mute);font-size:.9rem}
.score{font-size:.95rem;color:var(--mute)}
.score b{color:var(--ink)}

.controls{display:grid;gap:10px;margin-bottom:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 8px;font:inherit;font-size:.95rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px dashed var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--panel)}
.chip.red[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:var(--redsoft)}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;position:relative}
.card.memo{border-color:var(--red)}
.card.memo::after{content:none;position:absolute;top:-10px;right:14px;background:var(--panel);color:var(--red);font-size:.75rem;padding:0 6px}
.prompt{text-align:center;margin-bottom:14px}
.prompt .lbl{color:var(--mute);font-size:.85rem;margin-bottom:6px}
.prompt .name{font-size:1.7rem;font-weight:700;letter-spacing:-.01em;padding:18px 0}
.struct{display:block;margin:0 auto;height:150px;width:100%}
.struct text{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700;fill:var(--ink)}
.struct line,.struct path,.struct circle{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.struct .chg{stroke-width:1.3}
.struct .chgt{font-size:9px;font-weight:700}
.hint{color:var(--mute);font-size:.8rem;text-align:center;margin-top:4px}

.opts{display:grid;gap:10px;margin-top:6px}
.opts.names{grid-template-columns:1fr}
.opts.structs{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:1.02rem;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.opts.structs .opt{padding:8px 6px}
.opts.structs .struct{height:96px}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.opt.correct{border-color:var(--ok);background:var(--oksoft)}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}

.after{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;min-height:44px;flex-wrap:wrap}
.fb{font-size:1rem}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.next{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:11px 18px;font:inherit;font-size:1rem;cursor:pointer}
.next:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:.85rem;color:var(--mute)}
.linkbtn{border:0;background:none;color:var(--blue);font:inherit;font-size:.85rem;cursor:pointer;padding:0;text-decoration:underline}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (min-width:560px){ .opts.names{grid-template-columns:1fr 1fr} .opts.structs{grid-template-columns:repeat(4,1fr)} .opts.structs .struct{height:90px} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Functional groups quiz<small>Red-boxed groups · Chem 17 · Fall 2026</small></h1>
  <div class="score" id="score"></div>
</header>

<div class="controls">
  <div class="seg" role="group" aria-label="Quiz direction">
    <button id="modeSN" aria-pressed="true">See structure → pick name</button>
    <button id="modeNS" aria-pressed="false">See name → pick structure</button>
  </div>
  <div class="row" id="scopeRow" role="group" aria-label="Which groups to quiz"></div>
</div>

<div id="card" class="card"></div>

<div class="foot">
  <span id="poolInfo"></span>
  <button class="linkbtn" id="reset">Reset progress</button>
</div>
</div>

<script>
/* ---------- structure data ----------
   atoms: [x, y, label, charge]   bonds: [i, j, order, cx, cy]  (cx,cy = ring center → inner double)
   order: 1,2,3   'w' = wavy attachment point */
const A=(x,y,l='',c)=>[x,y,l,c];
function M(...parts){const a=[],b=[];for(const p of parts){const o=a.length;a.push(...p.a);for(const bb of p.b)b.push([bb[0]+o,bb[1]+o,...bb.slice(2)]);}return{a,b};}
function hex(cx,cy,dbl=true){const a=[],b=[];for(let k=0;k<6;k++){const t=Math.PI/180*(90+60*k);a.push(A(cx+Math.cos(t),cy-Math.sin(t)));}for(let k=0;k<6;k++)b.push([k,(k+1)%6,(dbl&&k%2==0)?2:1,cx,cy]);return{a,b};}
// tetrahedral center with substituents NW NE SW SE
function X4(nw,ne,sw,se,center='',chg){return{a:[A(0,0,center,chg),A(-.87,-.5,nw),A(.87,-.5,ne),A(-.87,.5,sw),A(.87,.5,se)],b:[[0,1],[0,2],[0,3],[0,4]]};}
// acyl: R–C(=O)–right
function ACYL(left,right){return{a:[A(0,0),A(0,-1,'O'),A(-.87,.5,left),A(.87,.5,right)],b:[[0,1,2],[0,2],[0,3]]};}
function addBond(s,i,j,o=1){s.b.push([i,j,o]);return s;}

const G={M:'memorize',T:'type'}; // card emphasis
const D=[];
const add=(n,g,m,s)=>D.push({n,g,m,s});

/* --- top red box --- */
add('1° alcohol','alcohols & amines',1,X4('R','OH','H','H'));
add('2° alcohol','alcohols & amines',1,X4('R','OH','R','H'));
add('3° alcohol','alcohols & amines',1,X4('R','OH','R','R'));
add('1° amine','alcohols & amines',1,{a:[A(-.87,.5,'R'),A(0,0,'NH₂')],b:[[0,1]]});
add('2° amine','alcohols & amines',1,{a:[A(0,0,'N'),A(0,-1,'H'),A(-.87,.5,'R'),A(.87,.5,'R')],b:[[0,1],[0,2],[0,3]]});
add('3° amine','alcohols & amines',1,{a:[A(0,0,'N'),A(0,-1,'R'),A(-.87,.5,'R'),A(.87,.5,'R')],b:[[0,1],[0,2],[0,3]]});
add('4° ammonium ion','alcohols & amines',1,X4('R','R','R','R','N','+'));
add('halide','alcohols & amines',1,{a:[A(-.87,.5,'R'),A(0,0,'X')],b:[[0,1]]});
add('ether','alcohols & amines',1,{a:[A(-.87,.5,'R'),A(0,0,'O'),A(.87,.5,'R')],b:[[0,1],[1,2]]});

/* --- carbonyls / acetals --- */
add('ketone','carbonyls',1,ACYL('R','R'));
add('aldehyde','carbonyls',1,ACYL('R','H'));
add('ketal','acetals',0,X4('R','OR','R','OR'));
add('acetal','acetals',0,X4('H','OR','R','OR'));
add('hemi-ketal','acetals',0,X4('R','OH','R','OR'));
add('hemi-acetal','acetals',0,X4('H','OH','R','OR'));
add('hydrate','acetals',0,X4('R','OH','R','OH'));
add('cyanohydrin','carbonyl derivatives',0,X4('R','CN','R','OH'));
add('hemiaminal','carbonyl derivatives',0,addBond(M(X4('R','NH','R','OH'),{a:[A(.87,-1.5,'R')],b:[]}),2,5));
add('aminal','carbonyl derivatives',0,X4('R','NR₂','R','NR₂'));
add('imine','carbonyl derivatives',1,{a:[A(0,0),A(0,-1,'N'),A(.87,-1.5,'R'),A(-.87,.5,'R'),A(.87,.5,'R')],b:[[0,1,2],[1,2],[0,3],[0,4]]});
add('iminium ion','carbonyl derivatives',1,{a:[A(0,0),A(0,-1,'N','+'),A(.87,-1.5,'R'),A(-.87,-1.5,'R'),A(-.87,.5,'R'),A(.87,.5,'R')],b:[[0,1,2],[1,2],[1,3],[0,4],[0,5]]});
const tri=(top,chg)=>({a:[A(-.5,.35),A(.5,.35),A(0,-.5,top,chg),A(-1.37,-.15,'R'),A(-.9,1.2,'R'),A(1.37,-.15,'R'),A(.9,1.2,'R')],b:[[0,1],[0,2],[1,2],[0,3],[0,4],[1,5],[1,6]]});
add('epoxide','carbonyl derivatives',1,tri('O'));

/* --- acyl groups (red) --- */
add('acid halide','acyl groups',1,ACYL('R','X'));
add('acid anhydride','acyl groups',1,{a:[A(0,0),A(0,-1,'O'),A(-.87,.5,'R'),A(.87,.5,'O'),A(1.73,0),A(1.73,-1,'O'),A(2.6,.5,'R')],b:[[0,1,2],[0,2],[0,3],[3,4],[4,5,2],[4,6]]});
add('ester','acyl groups',1,{a:[A(0,0),A(0,-1,'O'),A(-.87,.5,'R'),A(.87,.5,'O'),A(1.73,0,'R')],b:[[0,1,2],[0,2],[0,3],[3,4]]});
add('thioester','acyl groups',1,{a:[A(0,0),A(0,-1,'O'),A(-.87,.5,'R'),A(.87,.5,'S'),A(1.73,0,'R')],b:[[0,1,2],[0,2],[0,3],[3,4]]});
add('amide','acyl groups',1,{a:[A(0,0),A(0,-1,'O'),A(-.87,.5,'R'),A(.87,.5,'N'),A(1.73,0,'R'),A(.87,1.5,'R')],b:[[0,1,2],[0,2],[0,3],[3,4],[3,5]]});
add('carboxylic acid','acyl groups',1,ACYL('R','OH'));
const enol=(top,chg)=>({a:[A(0,0),A(0,-1,top,chg),A(-.87,.5,'R'),A(.87,.5),A(1.73,0,'R'),A(.87,1.5,'R')],b:[[0,1],[0,2],[0,3,2],[3,4],[3,5]]});
add('enol','acyl groups',1,enol('OH'));
add('enolate','acyl groups',1,enol('O','−'));
add('enamine','acyl groups',1,addBond(M(enol('NH'),{a:[A(-.87,-1.5,'R')],b:[]}),1,6));

/* --- misc red box --- */
add('peroxyacid','other groups',1,{a:[A(0,0),A(0,-1,'O'),A(-.87,.5,'R'),A(.87,.5,'O'),A(1.73,0,'OH')],b:[[0,1,2],[0,2],[0,3],[3,4]]});
add('alkene','other groups',1,{a:[A(-.5,0),A(.5,0),A(-1.37,-.5,'R'),A(-1.37,.5,'R'),A(1.37,-.5,'R'),A(1.37,.5,'R')],b:[[0,1,2],[0,2],[0,3],[1,4],[1,5]]});
add('alkyne','other groups',1,{a:[A(-1.5,0,'R'),A(-.5,0),A(.5,0),A(1.5,0,'R')],b:[[0,1],[1,2,3],[2,3]]});
add('nitro','other groups',1,{a:[A(0,0,'N','+'),A(-.87,.5,'R'),A(0,-1,'O'),A(.87,.5,'O','−')],b:[[0,1],[0,2,2],[0,3]]});
add('nitrile','other groups',1,{a:[A(-1,0,'R'),A(0,0),A(1,0,'N')],b:[[0,1],[1,2,3]]});
add('thiol','other groups',1,{a:[A(-.87,.5,'R'),A(0,0,'SH')],b:[[0,1]]});
add('phosphine','other groups',0,{a:[A(0,0,'R₃P')],b:[]});
add('phosphodiester','other groups',0,{a:[A(0,0,'P'),A(-.7,-.85,'O'),A(.7,-.85,'O'),A(-.87,.5,'RO'),A(.87,.5,'OR')],b:[[0,1,2],[0,2,2],[0,3],[0,4]]});

/* --- organometallics & halides --- */
add('Grignard reagent','organometallics',0,{a:[A(0,0,'R–MgBr')],b:[]});
add('organolithium','organometallics',0,{a:[A(0,0,'R–Li')],b:[]});
add('allyl halide','halides & more',0,{a:[A(0,-.5),A(.87,0),A(1.73,-.5),A(2.6,0,'X')],b:[[0,1,2],[1,2],[2,3]]});
add('benzyl halide','halides & more',0,addBond(M(hex(0,.5),{a:[A(.87,-1),A(1.73,-1.5,'X')],b:[[0,1]]}),0,6));
add('halohydrin','halides & more',0,{a:[A(0,0),A(0,-1,'X'),A(-.87,.5,'R'),A(.87,.5),A(.87,1.5,'OH'),A(1.73,0,'R')],b:[[0,1],[0,2],[0,3],[3,4],[3,5]]});
add('sulfonate','halides & more',0,{a:[A(0,0,'S'),A(-.87,.5,'R'),A(-.7,-.85,'O','−'),A(.7,-.85,'O'),A(.87,.5,'O')],b:[[0,1],[0,2],[0,3,2],[0,4,2]]});
add('sulfonic acid','halides & more',0,{a:[A(0,0,'S'),A(-.87,.5,'R'),A(-.75,-.85,'HO'),A(.7,-.85,'O'),A(.87,.5,'O')],b:[[0,1],[0,2],[0,3,2],[0,4,2]]});
add('disulfide','halides & more',0,{a:[A(-1.3,.5,'R'),A(-.43,0,'S'),A(.43,.5,'S'),A(1.3,0,'R')],b:[[0,1],[1,2],[2,3]]});
add('bromonium ion','halides & more',0,tri('Br','+'));

/* --- aromatics --- */
const arene=(top)=>addBond(M(hex(0,.3),{a:[A(0,-1.7,top)],b:[]}),0,6);
add('benzene','aromatics',1,hex(0,0));
add('aryl halide','aromatics',1,arene('X'));
add('phenol','aromatics',1,arene('OH'));
add('aniline','aromatics',1,addBond(addBond(M(arene('N'),{a:[A(-.87,-2.2,'R'),A(.87,-2.2,'R')],b:[]}),6,7),6,8));
add('pyridine','aromatics',0,(()=>{const h=hex(0,0);h.a[3][2]='N';return h;})());
add('indole','aromatics',0,(()=>{ // benzene fused with pyrrole
  const h=hex(0,0); // vertices 1 (upper-left) ... use right edge: vertices 5 (upper-right) and 4 (lower-right)
  const s=M(h,{a:[A(1.75,-1.0),A(2.3,0),A(1.75,1.0,'N'),A(2.3,1.9,'R')],b:[[0,1,2],[1,2],[2,3]]});
  s.b.push([5,6],[4,8]); return s;})());
add('imidazole','aromatics',0,{a:[A(0,-1),A(-.95,-.3,'N'),A(-.59,.81),A(.59,.81),A(.95,-.3,'N'),A(1.9,-.6,'R')],b:[[0,1,2],[1,2],[2,3,2],[3,4],[4,0],[4,5]]});

/* --- α/β notation --- */
add('β-hydroxycarbonyl','relative positions',0,{a:[A(0,0),A(0,-1,'OH'),A(-.87,.5,'R'),A(.87,.5),A(1.73,0),A(1.73,-1,'O'),A(2.6,.5,'R')],b:[[0,1],[0,2],[0,3],[3,4],[4,5,2],[4,6]]});
add('α,β-unsaturated carbonyl','relative positions',0,{a:[A(0,0),A(-.87,.5,'R'),A(.87,.5),A(1.73,0),A(1.73,-1,'O'),A(2.6,.5,'R')],b:[[0,1],[0,2,2],[2,3],[3,4,2],[3,5]]});
add('β-aminocarbonyl','relative positions',0,{a:[A(0,0),A(0,-1,'NH'),A(-.87,-1.5,'R'),A(-.87,.5,'R'),A(.87,.5),A(1.73,0),A(1.73,-1,'O'),A(2.6,.5,'R')],b:[[0,1],[1,2],[0,3],[0,4],[4,5],[5,6,2],[5,7]]});

/* --- alkyl groups (red box) --- */
const wavy=(s,i,x,y)=>{s.a.push(A(x,y));s.b.push([i,s.a.length-1,'w']);return s;};
add('n-propyl (n-Pr)','alkyl groups',1,wavy({a:[A(0,.5),A(.87,0),A(1.73,.5)],b:[[0,1],[1,2]]},2,2.4,1.1));
add('isopropyl (i-Pr)','alkyl groups',1,wavy({a:[A(0,0),A(-.87,-.5),A(-.87,.5)],b:[[0,1],[0,2]]},0,.9,.5));
add('sec-butyl (s-Bu)','alkyl groups',1,wavy({a:[A(0,0),A(-.87,.5),A(.87,.5),A(1.73,0)],b:[[0,1],[0,2],[2,3]]},0,0,-1));
add('tert-butyl (t-Bu)','alkyl groups',1,wavy({a:[A(0,0),A(-.87,-.5),A(-.87,.5),A(0,1)],b:[[0,1],[0,2],[0,3]]},0,.95,-.2));
add('n-butyl (n-Bu)','alkyl groups',1,wavy({a:[A(0,.5),A(.87,0),A(1.73,.5),A(2.6,0)],b:[[0,1],[1,2],[2,3]]},3,3.3,.6));
add('isobutyl (i-Bu)','alkyl groups',1,wavy({a:[A(0,0),A(0,-1),A(-.87,.5),A(.87,.5)],b:[[0,1],[0,2],[0,3]]},3,1.6,1.1));
add('cyclohexyl','alkyl groups',1,wavy(hex(0,0,false),5,1.73,-1.5));

/* --- substituents --- */
add('allyl','substituents',0,wavy({a:[A(0,-.5),A(.87,0),A(1.73,-.5)],b:[[0,1,2],[1,2]]},2,2.4,.1));
add('benzyl (Bn)','substituents',0,wavy(addBond(M(hex(0,.5),{a:[A(.87,-1)],b:[]}),0,6),6,1.73,-1.6));
add('vinyl','substituents',0,wavy({a:[A(0,-.5),A(.87,0)],b:[[0,1,2]]},1,1.73,-.5));
add('phenyl (Ph)','substituents',0,wavy(hex(0,.3),5,1.73,-1.2));
add('aryl (Ar)','substituents',0,wavy(addBond(M(hex(0,.3),{a:[A(0,2.3,'Y')],b:[]}),3,6),5,1.73,-1.2));
add('fluoro-','substituents',0,wavy({a:[A(0,0,'F')],b:[]},0,-1,0));
add('chloro-','substituents',0,wavy({a:[A(0,0,'Cl')],b:[]},0,-1,0));
add('bromo-','substituents',0,wavy({a:[A(0,0,'Br')],b:[]},0,-1,0));
add('iodo-','substituents',0,wavy({a:[A(0,0,'I')],b:[]},0,-1,0));

// keep only red-boxed groups
for(let i=D.length-1;i>=0;i--) if(!D[i].m) D.splice(i,1);

/* ---------- SVG renderer ---------- */
const U=30;
function svg(s,cls='struct'){
  const {a,b}=s; let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const at of a){const w=at[2]?0.28*at[2].length+0.2:0.25;minx=Math.min(minx,at[0]-w);maxx=Math.max(maxx,at[0]+w);miny=Math.min(miny,at[1]-.45);maxy=Math.max(maxy,at[1]+.45);}
  const pad=.35; minx-=pad;miny-=pad;maxx+=pad;maxy+=pad;
  let out='';
  const rad=(at,dx,dy)=>{if(!at[2])return 0;const L=at[2].length,len=Math.hypot(dx,dy)||1,c=Math.abs(dx)/len;return 0.32+0.17*(L-1)*c+0.05*(L-1)*(1-c);};
  for(const bd of b){
    const p=a[bd[0]],q=a[bd[1]],o=bd[2]||1;
    let dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);const ux=dx/len,uy=dy/len;
    const rp=rad(p,dx,dy),rq=rad(q,dx,dy);
    const x1=p[0]+ux*rp,y1=p[1]+uy*rp,x2=q[0]-ux*rq,y2=q[1]-uy*rq;
    const L=(ax,ay,bx,by)=>`<line x1="${(ax*U).toFixed(1)}" y1="${(ay*U).toFixed(1)}" x2="${(bx*U).toFixed(1)}" y2="${(by*U).toFixed(1)}"/>`;
    if(o==='w'){ // wavy
      const n=6,amp=.14,px=-uy,py=ux;let d=`M${(x1*U).toFixed(1)} ${(y1*U).toFixed(1)}`;
      for(let k=1;k<=n;k++){const t0=(k-.5)/n,t1=k/n,sgn=k%2?1:-1;const cx=x1+(x2-x1)*t0+px*amp*sgn,cy=y1+(y2-y1)*t0+py*amp*sgn;const ex=x1+(x2-x1)*t1,ey=y1+(y2-y1)*t1;d+=` Q${(cx*U).toFixed(1)} ${(cy*U).toFixed(1)} ${(ex*U).toFixed(1)} ${(ey*U).toFixed(1)}`;}
      out+=`<path d="${d}"/>`;continue;}
    if(o===1){out+=L(x1,y1,x2,y2);}
    else if(o===2){
      if(bd.length>=5){ // ring inner double
        out+=L(x1,y1,x2,y2);const cx=bd[3],cy=bd[4];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;let vx=cx-mx,vy=cy-my;const vl=Math.hypot(vx,vy);vx/=vl;vy/=vl;const off=.17,sh=.18;
        out+=L(x1+vx*off+ux*sh,y1+vy*off+uy*sh,x2+vx*off-ux*sh,y2+vy*off-uy*sh);
      }else{const px=-uy*.085,py=ux*.085;out+=L(x1+px,y1+py,x2+px,y2+py)+L(x1-px,y1-py,x2-px,y2-py);}
    }else if(o===3){const px=-uy*.15,py=ux*.15;out+=L(x1,y1,x2,y2)+L(x1+px,y1+py,x2+px,y2+py)+L(x1-px,y1-py,x2-px,y2-py);}
  }
  for(const at of a){
    if(at[2]) out+=`<text x="${(at[0]*U).toFixed(1)}" y="${(at[1]*U).toFixed(1)}" font-size="15" text-anchor="middle" dominant-baseline="central">${at[2]}</text>`;
    if(at[3]){const cx=(at[0]+.42+(at[2]?0.1*(at[2].length-1):0))*U,cy=(at[1]-.42)*U;out+=`<circle class="chg" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6"/><text class="chgt" x="${cx.toFixed(1)}" y="${(cy+.5).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${at[3]}</text>`;}
  }
  return `<svg class="${cls}" viewBox="${(minx*U).toFixed(1)} ${(miny*U).toFixed(1)} ${((maxx-minx)*U).toFixed(1)} ${((maxy-miny)*U).toFixed(1)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${out}</svg>`;
}

/* ---------- quiz ---------- */
const groups=[...new Set(D.map(d=>d.g))];
let mode='SN', scope='all', scopeGroup=null, q=null, locked=false;
let stats={}; try{stats=JSON.parse(localStorage.getItem('fgq-stats')||'{}')||{};}catch(e){stats={};}
function save(){try{localStorage.setItem('fgq-stats',JSON.stringify(stats));}catch(e){}}
const st=n=>stats[n]||(stats[n]={r:0,w:0});
let session={r:0,w:0,streak:0};

function pool(){
  if(scope==='memo')return D.filter(d=>d.m);
  if(scope==='missed')return D.filter(d=>st(d.n).w>st(d.n).r);
  if(scope==='group')return D.filter(d=>d.g===scopeGroup);
  return D;
}
const pick=(arr,n,excl)=>{const c=arr.filter(x=>!excl.includes(x));for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c.slice(0,n);};
function nextQ(){
  const P=pool(); if(!P.length){q=null;render();return;}
  // weight toward items missed more often
  const weighted=[];for(const d of P){const s=st(d.n);const w=1+Math.max(0,s.w-s.r)*2;for(let i=0;i<w;i++)weighted.push(d);}
  let ans=weighted[Math.floor(Math.random()*weighted.length)];
  if(q&&P.length>1&&ans.n===q.ans.n)ans=P[(P.indexOf(ans)+1)%P.length];
  let dis=pick(D.filter(d=>d.g===ans.g),3,[ans]);
  if(dis.length<3)dis=dis.concat(pick(D.filter(d=>d.g!==ans.g),3-dis.length,[ans,...dis]));
  const opts=pick([ans,...dis],4,[]);
  q={ans,opts};locked=false;render();
}
function render(){
  const card=document.getElementById('card');
  document.getElementById('score').innerHTML=`<b>${session.r}</b> right · <b>${session.w}</b> wrong${session.streak>=3?` · 🔥 ${session.streak}`:''}`;
  const P=pool();
  document.getElementById('poolInfo').textContent=`${P.length} group${P.length===1?'':'s'} in this set`;
  if(!q){card.className='card';card.innerHTML=`<div class="empty">${scope==='missed'?'Nothing missed yet — nice. Pick another set to keep going.':'No groups in this set.'}</div>`;return;}
  card.className='card'+(q.ans.m?' memo':'');
  let h='';
  if(mode==='SN'){
    h+=`<div class="prompt"><div class="lbl">Name this functional group</div>${svg(q.ans.s)}</div>`;
    h+=`<div class="opts names">`+q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.n}</button>`).join('')+`</div>`;
  }else{
    h+=`<div class="prompt"><div class="lbl">Pick the structure</div><div class="name">${q.ans.n}</div></div>`;
    h+=`<div class="opts structs">`+q.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-label="option ${i+1}">${svg(o.s)}</button>`).join('')+`</div>`;
  }
  h+=`<div class="after"><span class="fb" id="fb"></span></div>`;
  card.innerHTML=h;
  card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
}
function answer(i){
  if(locked)return;locked=true;
  const btns=[...document.querySelectorAll('.opt')];const ok=q.opts[i].n===q.ans.n;const s=st(q.ans.n);
  btns.forEach((b,k)=>{b.disabled=true;if(q.opts[k].n===q.ans.n)b.classList.add('correct');else if(k===i)b.classList.add('wrong');else b.classList.add('dim');});
  if(ok){s.r++;session.r++;session.streak++;}else{s.w++;session.w++;session.streak=0;}
  save();
  const fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');
  fb.textContent=ok?'Correct':(mode==='SN'?`It's ${q.ans.n}`:'Not that one — the correct structure is marked');
  const n=document.createElement('button');n.className='next';n.textContent='Next';n.addEventListener('click',nextQ);fb.parentElement.appendChild(n);n.focus();
  document.getElementById('score').innerHTML=`<b>${session.r}</b> right · <b>${session.w}</b> wrong${session.streak>=3?` · 🔥 ${session.streak}`:''}`;
}

/* controls */
const mSN=document.getElementById('modeSN'),mNS=document.getElementById('modeNS');
mSN.onclick=()=>{mode='SN';mSN.setAttribute('aria-pressed','true');mNS.setAttribute('aria-pressed','false');render();};
mNS.onclick=()=>{mode='NS';mNS.setAttribute('aria-pressed','true');mSN.setAttribute('aria-pressed','false');render();};
const row=document.getElementById('scopeRow');
function chips(){
  row.innerHTML='';
  const mk=(label,key,grp,cls='')=>{const b=document.createElement('button');b.className='chip '+cls;b.textContent=label;const on=scope===key&&(key!=='group'||scopeGroup===grp);b.setAttribute('aria-pressed',on?'true':'false');b.onclick=()=>{scope=key;scopeGroup=grp;chips();nextQ();};row.appendChild(b);};
  mk('All red-boxed','all',null,'red');mk('Ones I miss','missed');
  for(const g of groups)mk(g,'group',g);
}
document.getElementById('reset').onclick=()=>{if(!confirm('Clear your saved right/wrong history?'))return;stats={};save();session={r:0,w:0,streak:0};nextQ();};
chips();nextQ();
</script>
</body>
